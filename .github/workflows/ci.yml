name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 👉 permite rodar manualmente

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------
      # INSTALL DEPENDENCIES
      # ---------------------------------------
      - name: Install deps (web)
        run: cd apps/web && npm ci

      - name: Install deps (api)
        run: cd apps/api && npm ci

      # ---------------------------------------
      # UNIT TESTS
      # ---------------------------------------
      - name: Run unit tests (api)
        run: cd apps/api && npm test

      - name: Run unit tests (web)
        run: cd apps/web && npm test --if-present

      # ---------------------------------------
      # BUILD
      # ---------------------------------------
      - name: Build web
        run: cd apps/web && npm run build

      # ---------------------------------------
      # DEPLOY TO GITHUB PAGES
      # ---------------------------------------
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/dist
          publish_branch: gh-pages

      # ---------------------------------------
      # START PREVIEW SERVER FOR PLAYWRIGHT
      # ---------------------------------------
      - name: Start Preview Server
        run: |
          cd apps/web
          npx serve -s dist -l 4173 &
          echo $! > server.pid
          sleep 5

      # ---------------------------------------
      # RUN PLAYWRIGHT TESTS
      # ---------------------------------------
      - name: Run Playwright Tests
        run: |
          cd apps/web
          npx playwright install --with-deps
          npx playwright test --reporter=html
        env:
          E2E_BASE_URL: http://localhost:4173

      # ---------------------------------------
      # STOP SERVER
      # (IMPEDITO JOB FICAR RODANDO 6 HORAS)
      # ---------------------------------------
      - name: Stop Preview Server
        run: |
          if [ -f apps/web/server.pid ]; then
            kill -9 $(cat apps/web/server.pid) || true
          fi

      # ---------------------------------------
      # UPLOAD PLAYWRIGHT REPORT
      # ---------------------------------------
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

      # ---------------------------------------
      # LIGHTHOUSE
      # ---------------------------------------
      - name: LHCI
        if: always()
        run: |
          cd apps/web
          npx @lhci/cli autorun || true

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
